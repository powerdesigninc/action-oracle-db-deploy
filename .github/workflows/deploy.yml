name: Oracle Database Deploy Pipeline

on:
  workflow_call:
    inputs:
      DB_HOST:
        type: string
        required: true
      DB_USER:
        type: string
        required: true
      DB_APP_ID:
        type: string
        required: false
      INSTALL_PATH:
        type: string
        required: true
      FLOWS:
        type: string
        required: false
        default: installs
      CONTINUE_ON_ERROR:
        type: boolean
        required: false
        default: true
    secrets:
      VPN_PASSWORD:
        required: true
      VPN_USERNAME:
        required: true
      DB_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/powerdesigninc/action-oracle-db-deploy:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Required for openconnect TUN interface creation inside the container
      options: --cap-add=NET_ADMIN --device /dev/net/tun

    steps:
      - name: Checkout Caller Repo Code
        uses: actions/checkout@v6

      - name: Connect VPN
        env:
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          VPN_HOST: ${{ vars.VPN_HOST }}
        run: |
          printf '%s\n' "$VPN_PASSWORD" | openconnect \
            --protocol=fortinet \
            --user="$VPN_USERNAME" \
            --servercert pin-sha256:xTfEl6uMQJET4m7IV1POt76XV9KYBSwMlZKL0Zvx0h8= \
            --passwd-on-stdin \
            --background \
            "$VPN_HOST"

      - name: Verify VPN Connectivity
        run: |
          # openconnect --background returns before the TUN route is installed
          sleep 5
          ping -c 3 -W 5 docker.powerdesigninc.us

      - name: Run Oracle Deployment
        env:
          DB_HOST: ${{ inputs.DB_HOST }}
          DB_USER: ${{ inputs.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_APP_ID: ${{ inputs.DB_APP_ID }}
          INSTALL_PATH: ${{ inputs.INSTALL_PATH }}
          FLOWS: ${{ inputs.FLOWS }}
        run: |
          oracle-db-deploy \
            --host "$DB_HOST" \
            --user "$DB_USER" \
            --password "$DB_PASSWORD" \
            --app-id "$DB_APP_ID" \
            --install-path "$INSTALL_PATH" \
            --flows "$FLOWS" \
            --continue-on-error=${{ inputs.CONTINUE_ON_ERROR }}
